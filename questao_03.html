<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desconto</title>
</head>
<body>

    <h1>Calculadora de Desconto</h1>

    <label>Valor do produto:</label>
    <input type="number" id="valor" step="0.01">

    <br><br>

    <button onclick="calcularDesconto()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcularDesconto() {
            let valor = Number(document.getElementById("valor").value);
            let desconto = 0;

            if (valor <= 100) {
                desconto = 0;
            } else if (valor <= 500) {
                desconto = 10;
            } else {
                desconto = 15;
            }

            let valorDesconto = valor * desconto / 100;
            let valorFinal = valor - valorDesconto;

            let resultado = document.getElementById("resultado");

            resultado.innerHTML =
                "Valor original: R$ " + valor.toFixed(2) +
                "<br>Desconto aplicado: " + desconto + "%" +
                "<br>Valor do desconto: R$ " + valorDesconto.toFixed(2) +
                "<br>Valor final: R$ " + valorFinal.toFixed(2);

            if (desconto == 0) {
                resultado.style.color = "blue";
            } else if (desconto == 10) {
                resultado.style.color = "orange";
            } else {
                resultado.style.color = "green";
            }
        }
    </script>

</body>
</html>
