<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <label>Peso (kg):</label>
    <input type="number" id="peso">

    <br><br>

    <label>Altura (m):</label>
    <input type="number" id="altura" step="0.01">

    <br><br>

    <button onclick="calcularIMC()">Calcular IMC</button>

    <p id="resultado"></p>

    <script>
        function calcularIMC() {
            let peso = Number(document.getElementById("peso").value);
            let altura = Number(document.getElementById("altura").value);

            let imc = peso / (altura * altura);

            let resultado = document.getElementById("resultado");

            if (imc < 18.5) {
                resultado.innerHTML = "IMC: " + imc.toFixed(2) + " - Abaixo do peso";
                resultado.style.color = "blue";
            } else if (imc < 25) {
                resultado.innerHTML = "IMC: " + imc.toFixed(2) + " - Peso normal";
                resultado.style.color = "green";
            } else if (imc < 30) {
                resultado.innerHTML = "IMC: " + imc.toFixed(2) + " - Sobrepeso";
                resultado.style.color = "orange";
            } else {
                resultado.innerHTML = "IMC: " + imc.toFixed(2) + " - Obesidade";
                resultado.style.color = "red";
            }
        }
    </script>

</body>
</html>
