<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Classificação por Idade</title>
</head>
<body>

    <h1>Classificação por Idade</h1>

    <label>Digite sua idade:</label>
    <input type="number" id="idade">

    <br><br>

    <button onclick="classificarIdade()">Classificar</button>

    <p id="resultado"></p>

    <script>
        function classificarIdade() {
            let idade = Number(document.getElementById("idade").value);
            let resultado = document.getElementById("resultado");

            if (idade <= 12) {
                resultado.innerHTML = "Criança";
                resultado.style.color = "blue";
            } else if (idade <= 17) {
                resultado.innerHTML = "Adolescente";
                resultado.style.color = "orange";
            } else if (idade <= 59) {
                resultado.innerHTML = "Adulto";
                resultado.style.color = "green";
            } else {
                resultado.innerHTML = "Idoso";
                resultado.style.color = "purple";
            }
        }
    </script>

</body>
</html>
